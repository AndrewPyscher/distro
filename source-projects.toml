schema = 1

# Local component clones follow organization main. Build receipts record actual inputs.
[projects.telorgon]
repository = "https://github.com/WIPOperatingSystemName/telorgon.git"
branch = "main"
inputs = ["Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "crates", "third_party", "packaging"]

[projects.test-shell]
repository = "https://github.com/WIPOperatingSystemName/shell.git"
branch = "main"
inputs = ["Cargo.toml", "Cargo.lock", "src", "assets", "licenses", "tests"]
overlay = "telorgon-shell"

[projects.telorgon-file-explorer]
repository = "https://github.com/WIPOperatingSystemName/file-explorer.git"
branch = "main"
inputs = ["Cargo.toml", "Cargo.lock", "src", "assets", "licenses", "packaging"]

[projects.telorgon-settings-app]
repository = "https://github.com/WIPOperatingSystemName/settings.git"
branch = "main"
inputs = ["Cargo.toml", "Cargo.lock", "src", "assets"]

[projects.telorgon-portal-picker]
repository = "https://github.com/WIPOperatingSystemName/portal-picker.git"
branch = "main"
inputs = ["Cargo.toml", "Cargo.lock", "src", "assets", "licenses"]

[projects.telorgon-bootloader]
repository = "https://github.com/WIPOperatingSystemName/bootloader.git"
branch = "main"
inputs = ["Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "crates", "configs", "tools"]
update = "base"
