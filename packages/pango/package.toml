schema = 1

[package]
name = "pango"
version = "1.56.4"
revision = 1
arch = "x86_64"
description = "Unicode text layout library"
license = "LGPL-2.1-or-later"

[[sources]]
name = "main"
url = "https://download.gnome.org/sources/pango/1.56/pango-1.56.4.tar.xz"
filename = "pango-1.56.4.tar.xz"
sha256 = "17065e2fcc5f5a5bdbffc884c956bfc7c451a96e8c4fb2f8ad837c6413cb5a01"

[dependencies]
native = []
target = ["glib", "harfbuzz", "fribidi", "fontconfig", "freetype", "cairo", "libstdc++"]
runtime = ["glib", "harfbuzz", "fribidi", "fontconfig", "freetype", "cairo"]

[build]
adapter = "script"
commands = [["python3", "{recipe}/build.py"]]
