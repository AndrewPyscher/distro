schema = 1

[package]
name = "libepoxy"
version = "1.5.10"
revision = 1
arch = "x86_64"
description = "Dynamic OpenGL and EGL function dispatch"
license = "MIT"

[[sources]]
name = "main"
url = "https://download.gnome.org/sources/libepoxy/1.5/libepoxy-1.5.10.tar.xz"
filename = "libepoxy-1.5.10.tar.xz"
sha256 = "072cda4b59dd098bba8c2363a6247299db1fa89411dc221c8b81b8ee8192e623"

[dependencies]
native = []
target = ["glibc", "mesa-headers"]
runtime = ["glibc"]

[build]
adapter = "script"
commands = [["python3", "{recipe}/build.py"]]
