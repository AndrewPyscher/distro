schema = 1

[package]
name = "ncurses"
version = "6.5"
revision = 1
arch = "x86_64"
description = "Terminal capability database, tools and wide-character libraries"
license = "MIT"

[[sources]]
name = "main"
url = "https://ftp.gnu.org/gnu/ncurses/ncurses-6.5.tar.gz"
filename = "ncurses-6.5.tar.gz"
sha256 = "136d91bc269a9a5785e5f9e980bc76ab57428f604ce3e5a5a90cebc767971cc6"

[dependencies]
native = []
target = ["glibc"]
runtime = ["glibc", "busybox"]

[build]
adapter = "script"
commands = [["python3", "{recipe}/build.py"]]
